name: Publish complete animated portfolio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-portfolio.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Restore homepage and all four working projects
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, json, gzip, base64
          src=Path('emon_animated_portfolio_ready.zip')
          if not src.is_file(): raise SystemExit('Portfolio archive not found in repository')
          out=Path('_built_portfolio')
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(src) as z:
              for item in z.infolist():
                  if item.is_dir(): continue
                  path=Path(item.filename)
                  if len(path.parts)<2 or path.parts[0]!='emon_animated_portfolio' or '..' in path.parts:
                      raise SystemExit('Unexpected file in portfolio archive: '+str(path))
                  dest=out.joinpath(*path.parts[1:])
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(item))
          fixes=json.loads(gzip.decompress(base64.b64decode('')))
          for name,edits in fixes.items():
              p=out/name
              b=bytearray(p.read_bytes())
              for start,stop,replacement in reversed(edits):
                  b[start:stop]=base64.b64decode(replacement)
              p.write_bytes(b)
          (out/'.nojekyll').touch()
          (out/'404.html').write_text(
              '<!doctype html><html lang="en"><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width,initial-scale=1">'
              '<title>Page Not Found | MD Emon Hossain</title>'
              '<main style="font:20px Arial;max-width:560px;margin:14vh auto;padding:24px">'
              '<h1>Page not found</h1><p>Return to the main portfolio to see my projects.</p>'
              '<a href="/emon-animated-portfolio-/">Back to portfolio</a></main></html>',encoding='utf-8')
          (out/'README.md').write_text(
              '# MD Emon Hossain | Animated Portfolio\n\n'
              'Professional English-language portfolio with four functional browser projects.\n'
              'Includes CSV quality auditor, employee records manager, monthly reporting dashboard and document formatting studio.\n'
              'These are independent portfolio projects, not claims of previous paid client work.\n'
              'Published at https://mdemonimt.github.io/emon-animated-portfolio-/\n',encoding='utf-8')
          essential=['index.html','assets/styles.css','assets/site.js','assets/common.js',
                     'assets/emon-portrait.png','resume/MD_EMON_HOSSAIN_CV.pdf']
          essential += ['projects/'+p+'/index.html' for p in
                       ['records-manager','reporting-dashboard','data-quality-auditor','document-studio']]
          assert all((out/p).is_file() for p in essential), 'Missing required portfolio files'
          assert 'MD EMON HOSSAIN' in (out/'index.html').read_text(encoding='utf-8')
          assert 'reliable scroll reveals: never hide' in (out/'assets/styles.css').read_text()
          print('Validated complete site:',len(list(out.rglob('*'))),'entries')
          PY
      - name: Synchronize public website sources to main
        shell: bash
        run: |
          cp -a _built_portfolio/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html README.md .nojekyll assets projects resume
          if ! git diff --cached --quiet; then
            git commit -m "Restore and publish the complete animated portfolio website"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload built pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _built_portfolio
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
