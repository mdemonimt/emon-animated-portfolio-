name: Publish animated portfolio
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'webild-stage/**'
      - 'projects/**'
      - 'resume/**'
      - '.github/workflows/publish-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: emon-portfolio-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout completed site
        uses: actions/checkout@v4

      - name: Validate homepage, animations and project files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
            'index.html', 'assets/styles.css', 'assets/site.js',
            'assets/common.js', 'assets/emon-portrait.png',
            'resume/MD_EMON_HOSSAIN_CV.pdf',
            'projects/records-manager/index.html',
            'projects/reporting-dashboard/index.html',
            'projects/data-quality-auditor/index.html',
            'projects/document-studio/index.html',
            'projects/index.html',
            'webild-stage/assets/index-B0UAL4Xi.js',
            'webild-stage/assets/HomePage-Dbyn_WWS.js',
            'webild-stage/assets/NudgeFrame-DaCJukSj.js',
            'webild-stage/assets/index-zM5fJp71.css',
            'webild-stage/favicon.svg'
          ]
          missing=[p for p in required if not Path(p).is_file()]
          if missing: raise SystemExit('Missing files: ' + ', '.join(missing))
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('assets/styles.css').read_text(encoding='utf-8')
          js=Path('assets/site.js').read_text(encoding='utf-8')
          assert 'MD EMON HOSSAIN' in html
          assert 'webild-stage/assets/index-B0UAL4Xi.js' in html
          assert 'webild-stage/assets/index-zM5fJp71.css' in html
          assert 'Webild' in html or 'webild' in html
          assert 'data-section="testimonial"' in html
          print('Portfolio HTML, animation assets and four projects verified')
          PY
          mkdir -p _site
          cp index.html .nojekyll 404.html _site/
          cp -a assets projects resume _site/
          cp -a webild-stage _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
