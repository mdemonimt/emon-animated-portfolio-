name: Import Webild original preview to staging
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-webild-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download original Webild HTML and same-preview assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse, urljoin, urldefrag
          from html.parser import HTMLParser
          import re, json
          base='https://storage.googleapis.com/webild/previews/5f7a624e-fe6f-4528-92b0-b23d21dcc273/'
          root=Path('webild-stage')
          root.mkdir(exist_ok=True)
          def get(url):
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 PortfolioMigration/1.0'}),timeout=40) as res:
                  blob=res.read(16*1024*1024)
                  if len(blob)>=16*1024*1024: raise ValueError('Asset too large: '+url)
                  return blob
          html=get(base+'index.html')
          (root/'index.html').write_bytes(html)
          print('Original HTML length:',len(html))
          class Parser(HTMLParser):
              def __init__(self):super().__init__();self.refs=set()
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k in ('src','href','poster','data-src') and v:self.refs.add(v)
                      if k=='srcset' and v:
                          self.refs.update(t.strip().split(' ')[0] for t in v.split(',') if t.strip())
          parser=Parser();parser.feed(html.decode('utf-8','replace'))
          parser.refs.update(re.findall(r'url\(\s*[\'" ]?([^\)\'" ]+)',html.decode('utf-8','replace')))
          downloaded={}
          skipped=[]
          pending=list(parser.refs)
          seen=set()
          while pending and len(downloaded)<150:
              ref=pending.pop()
              if not ref or ref.startswith(('data:','#','blob:','mailto:','javascript:')):continue
              u=urldefrag(urljoin(base,ref))[0]
              if u in seen:continue
              seen.add(u)
              if not u.startswith(base):
                  skipped.append(ref)
                  continue
              relative=u[len(base):].split('?')[0]
              path=Path(relative)
              if not relative or '..' in path.parts or path.is_absolute():continue
              try:
                  body=get(u)
                  dest=root/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(body)
                  downloaded[relative]=len(body)
                  if relative.endswith('.css'):
                      text=body.decode('utf-8','replace')
                      for v in re.findall(r'url\(\s*[\'" ]?([^\)\'" ]+)',text):
                          pending.append(urljoin(u,v))
              except Exception as exc:
                  skipped.append(u+' ERROR '+str(exc))
          # Vite dynamic import required for the actual Webild homepage.
          for relative in ['assets/HomePage-Dbyn_WWS.js']:
              try:
                  body=get(base+relative)
                  dest=root/relative
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(body)
                  downloaded[relative]=len(body)
                  print('Downloaded lazy-loaded homepage:', relative, len(body))
              except Exception as exc:
                  raise SystemExit('The Webild homepage chunk is required: '+str(exc))
          (root/'import-manifest.json').write_text(json.dumps({'source':base+'index.html','html_bytes':len(html),'downloaded':downloaded,'other_references':skipped[:80]},indent=2),encoding='utf-8')
          print('Imported same-folder assets:',len(downloaded),'External/missing refs:',len(skipped))
          PY
      - name: Commit staging copy without changing public homepage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webild-stage/
          if ! git diff --cached --quiet; then
            git commit -m "Stage original Webild preview for independent GitHub migration"
            git push origin HEAD:main
          fi
